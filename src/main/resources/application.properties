# server.port=3001
server.port=${PORT:5000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fundaciones_colombia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fundaciones_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fundaciones_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
# ddl means Data Definition Language, which is a set of SQL commands used to define and manage database schema. The ddl-auto property in Spring Boot's JPA configuration determines how the application should handle the database schema at startup. The "validate" option means that Hibernate will validate the existing schema against the entity mappings defined in the application. If there are any discrepancies, it will throw an error. This is useful for ensuring that the database schema is in sync with the application's entity definitions without making any changes to the database itself.
# the update option would automatically update the database schema to match the entity definitions, which can be convenient during development but is generally not recommended for production environments as it can lead to unintended consequences.
spring.jpa.hibernate.ddl-auto=validate 
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

