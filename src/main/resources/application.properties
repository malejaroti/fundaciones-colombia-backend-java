server.port=3001

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fundaciones_colombia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fundaciones_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fundaciones_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

